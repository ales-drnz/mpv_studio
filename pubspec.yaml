name: mpv_studio
description: "MPV Studio"
publish_to: 'none'
version: 0.2.11

environment:
  sdk: ^3.6.0
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter

  # mpv_audio_kit
  #mpv_audio_kit: {path: ../mpv_audio_kit}
  mpv_audio_kit: ^0.4.4

  # dart_jellyfin
  #dart_jellyfin: {path: ../../Tools/dart_jellyfin}
  dart_jellyfin: ^0.1.0

  # dart_plex
  #dart_plex: {path: ../../Tools/dart_plex}
  dart_plex: ^0.1.0

  # dart_smb2
  #dart_smb2: {path: ../../Tools/dart_smb2}
  dart_smb2: ^0.1.0

  # Other dependencies
  file_selector: ^1.0.3
  desktop_drop: ^0.7.1
  shared_preferences: ^2.5.4
  go_router: ^17.2.3
  infinite_scroll_pagination: ^5.1.1
  flutter_launcher_icons: ^0.14.4
  device_info_plus: ^13.1.0
  youtube_explode_dart: ^3.1.0
  uuid: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/

flutter_launcher_icons:
  android: true
  windows:
    generate: true
  image_path: "assets/mpv_studio.png"
  min_sdk_android: 21
