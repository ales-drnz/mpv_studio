name: mpv_studio
description: "MPV Studio"
publish_to: 'none'
version: 0.3.0

environment:
  sdk: ^3.10.0
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter

  # mpv_audio_kit
  #mpv_audio_kit: {path: ../mpv_audio_kit}
  mpv_audio_kit: ^0.5.1

  # dart_jellyfin
  #dart_jellyfin: {path: ../../Tools/dart_jellyfin}
  dart_jellyfin: ^0.2.1

  # dart_plex
  #dart_plex: {path: ../../Tools/dart_plex}
  dart_plex: ^0.1.3

  # dart_smb2
  #dart_smb2: {path: ../../Tools/dart_smb2}
  dart_smb2: ^0.1.3

  # Other dependencies
  file_selector: ^1.1.0
  desktop_drop: ^0.8.4
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^11.2.0
  go_router: ^17.5.0
  infinite_scroll_pagination: ^5.1.1
  device_info_plus: ^13.2.0
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  fake_async: ^1.3.3
  flutter_lints: ^6.0.0
  dio: ^5.11.1
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/models/

# App icons. Run `python3 tool/app_icons.py` first: it derives the sources
# under assets/icon/ from the logo, plus the Windows .ico (every size) and
# the Linux window icon, which this tool does not cover.
flutter_launcher_icons:
  image_path: "assets/mpv_studio.png"
  android: true
  min_sdk_android: 24
  adaptive_icon_background: "#24282D"
  adaptive_icon_foreground: "assets/icon/android_foreground.png"
  adaptive_icon_foreground_inset: 0
  adaptive_icon_monochrome: "assets/icon/android_monochrome.png"
  ios: true
  image_path_ios: "assets/icon/ios.png"
  remove_alpha_ios: true
  macos:
    generate: true
    image_path: "assets/icon/macos.png"
