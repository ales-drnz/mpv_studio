name: Set up mpv_studio
description: >-
  Installs Flutter, provides mpv_audio_kit (a checkout of the library when
  the app's pubspec has a path dependency on it), optionally points its
  build hook at the libmpv of a libmpv-scripts run, and runs flutter pub get.
  Expects the app checked out in mpv_studio/ under the workspace.
inputs:
  flutter-version:
    description: The Flutter version on the stable channel, like 3.47.x, or any for the latest.
    required: false
    default: any
  mpv-audio-kit-ref:
    description: >-
      The ales-drnz/mpv_audio_kit branch, tag or commit to check out when
      the app depends on the library by path. Ignored for a pub.dev
      dependency.
    required: true
  libmpv-run:
    description: >-
      A libmpv-scripts workflow run whose libmpv-release artifact the build
      hook should bundle instead of the pinned libmpv release. Empty for the
      pinned release, and for jobs that never run the hook.
    required: false
    default: ''
  token:
    description: >-
      A token with Actions read access on ales-drnz/libmpv-scripts, needed
      with libmpv-run. The workflow's own GITHUB_TOKEN cannot download
      another repository's artifacts, even a public one.
    required: false
    default: ''
runs:
  using: composite
  steps:
    - uses: subosito/flutter-action@v2
      with:
        channel: stable
        flutter-version: ${{ inputs.flutter-version }}
        cache: true

    # The dependency is either `mpv_audio_kit: {path: ../mpv_audio_kit}`
    # (before the library is on pub.dev) or a version constraint. A path
    # dependency resolves against the workspace: the app sits in
    # mpv_studio/, so the library goes to mpv_audio_kit/ beside it.
    - id: dep
      shell: bash
      working-directory: mpv_studio
      env:
        REF: ${{ inputs.mpv-audio-kit-ref }}
      run: |
        path=$(awk '
          /^[^ #]/ { deps = ($0 ~ /^dependencies:/) }
          deps && /^  mpv_audio_kit:/ {
            if (match($0, /path: *[^ },]+/)) {
              p = substr($0, RSTART, RLENGTH); sub(/^path: */, "", p); print p; exit
            }
            want = 1; next
          }
          want && /^    path:/ { sub(/^    path: */, ""); print; exit }
          { want = 0 }
        ' pubspec.yaml | tr -d "\"'")
        if [[ -z "$path" ]]; then
          echo "mpv_audio_kit comes from pub.dev"
        elif [[ "$path" != ../mpv_audio_kit ]]; then
          echo "::error::pubspec.yaml depends on mpv_audio_kit at $path; CI only provides ../mpv_audio_kit."
          exit 1
        else
          echo "mpv_audio_kit is a path dependency: checking out $REF"
          echo "path=true" >> "$GITHUB_OUTPUT"
        fi
    - if: steps.dep.outputs.path == 'true'
      uses: actions/checkout@v4
      with:
        repository: ales-drnz/mpv_audio_kit
        ref: ${{ inputs.mpv-audio-kit-ref }}
        path: mpv_audio_kit

    - id: libmpv
      if: inputs.libmpv-run != ''
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        RUN_ID: ${{ inputs.libmpv-run }}
        FORK: ${{ github.event.pull_request.head.repo.fork }}
      run: |
        if [[ -z "$GH_TOKEN" ]]; then
          if [[ "$FORK" == true ]]; then
            # A pull request from a fork gets no secrets: it builds against
            # the pinned release instead.
            echo "::warning::No LIBMPV_SCRIPTS_TOKEN on a fork pull request: using the pinned libmpv release."
            exit 0
          fi
          echo "::error::A libmpv-scripts run is set but LIBMPV_SCRIPTS_TOKEN is not: add a token with Actions read access on ales-drnz/libmpv-scripts."
          exit 1
        fi
        # Say which build is under test, and refuse one that did not pass.
        read -r sha branch conclusion < <(gh api \
          "repos/ales-drnz/libmpv-scripts/actions/runs/$RUN_ID" \
          --jq '"\(.head_sha) \(.head_branch) \(.conclusion)"')
        echo "libmpv-scripts run $RUN_ID: $branch at $sha, $conclusion"
        if [[ "$conclusion" != success ]]; then
          echo "::error::libmpv-scripts run $RUN_ID did not succeed ($conclusion)."
          exit 1
        fi
        echo "use=true" >> "$GITHUB_OUTPUT"
    - if: steps.libmpv.outputs.use == 'true'
      uses: actions/download-artifact@v4
      with:
        name: libmpv-release
        repository: ales-drnz/libmpv-scripts
        run-id: ${{ inputs.libmpv-run }}
        github-token: ${{ inputs.token }}
        path: ${{ runner.temp }}/libmpv
    # The user define is added here, on the runner, and never committed.
    - if: steps.libmpv.outputs.use == 'true'
      shell: bash
      working-directory: mpv_studio
      run: |
        if grep -q '^hooks:' pubspec.yaml; then
          echo "::error::pubspec.yaml already has a hooks section: merge the libmpv user define into it by hand."
          exit 1
        fi
        printf '\nhooks:\n  user_defines:\n    mpv_audio_kit:\n      libmpv: %s\n' \
          "$RUNNER_TEMP/libmpv" >> pubspec.yaml

    - shell: bash
      working-directory: mpv_studio
      run: flutter pub get

    # The user define skips the hook's checksums, so binaries that do not
    # match the ones the library pins would stay green until the release.
    - if: steps.libmpv.outputs.use == 'true'
      shell: bash
      working-directory: mpv_studio
      run: |
        root=$(jq -r '.packages[] | select(.name == "mpv_audio_kit") | .rootUri' \
          .dart_tool/package_config.json)
        case "$root" in
          file:///[A-Za-z]:*) hook="${root#file:///}/hook/build.dart" ;;
          file://*) hook="${root#file://}/hook/build.dart" ;;
          *) hook=".dart_tool/$root/hook/build.dart" ;;
        esac
        jq -r '.assets | to_entries[] | "\(.key) \(.value)"' \
          "$RUNNER_TEMP/libmpv/manifest.json" |
          while read -r asset sha; do
            # jq.exe on Windows ends its lines with CRLF.
            sha="${sha%$'\r'}"
            grep -q "$sha" "$hook" ||
              echo "::warning::$asset of this libmpv-scripts run is not the one mpv_audio_kit pins."
          done
