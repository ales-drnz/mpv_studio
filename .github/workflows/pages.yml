name: Web demo

# Builds the web app and publishes it on GitHub Pages, the demo linked from
# the README of mpv_audio_kit. Until mpv_audio_kit 0.6.0 is on pub.dev the
# web app lives on wip/web, and a push there publishes it; main gets it with
# the release. Otherwise it runs by hand.
#
# libmpv runs on threads, so the page must be cross-origin isolated. Pages
# cannot send the COOP and COEP headers that make it so: web/index.html
# loads coi-serviceworker.js, which adds them from a service worker, and
# web/flutter_bootstrap.js keeps Flutter from registering a worker of its
# own on the same scope. Before the deploy, tool/web_smoke.sh opens the
# build as Pages serves it and checks that the page is isolated and loads
# libmpv.
#
# Setup, once: Settings > Pages > Build and deployment > Source: GitHub
# Actions, and wip/web in the deployment branches of the github-pages
# environment (Settings > Environments), which allows the default branch
# only.

on:
  push:
    branches: [wip/web]
  workflow_dispatch:
    inputs:
      mpv_audio_kit_ref:
        description: mpv_audio_kit branch, tag or commit, used while the app depends on it by path
        type: string
        default: release/0.6.0
      libmpv_scripts_run:
        description: libmpv-scripts run id whose libmpv-release artifact gives the web module (empty to find the Build of the libmpv release mpv_audio_kit needs while it is not published)
        type: string
        default: ''

permissions:
  contents: read

# One deploy at a time; a newer run waits for the one in progress.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Not vars.MPV_AUDIO_KIT_REF either: the web needs 0.6.0. The fallback
  # goes at the release, with the same one in the web job of ci.yml.
  MPV_AUDIO_KIT_REF: ${{ inputs.mpv_audio_kit_ref || 'release/0.6.0' }}
  # The web module comes from libmpv-r20 on. Empty, the setup action lets
  # the library checkout find the libmpv-scripts Build of the release it
  # needs while that release is not published
  # (scripts/ci/resolve_libmpv_run.sh of mpv_audio_kit); the input forces
  # one. Not vars.LIBMPV_SCRIPTS_RUN, which the native builds of ci.yml may
  # point at an older libmpv.
  LIBMPV_SCRIPTS_RUN: ${{ inputs.libmpv_scripts_run }}

defaults:
  run:
    shell: bash
    working-directory: mpv_studio

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: mpv_studio
      - uses: ./mpv_studio/.github/actions/setup
        with:
          mpv-audio-kit-ref: ${{ env.MPV_AUDIO_KIT_REF }}
          libmpv-run: ${{ env.LIBMPV_SCRIPTS_RUN }}
          token: ${{ secrets.LIBMPV_SCRIPTS_TOKEN }}

      # The web module, the build and the smoke test, shared with the web
      # job of ci.yml so that it checks the build published here.
      - uses: ./mpv_studio/.github/actions/web

      - uses: actions/upload-pages-artifact@v4
        with:
          path: mpv_studio/build/web

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
